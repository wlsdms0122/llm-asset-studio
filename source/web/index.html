<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b6ef5'/%3E%3Cpath d='M9 21l5-10 4 7 2-3 3 6z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/ui.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="appbar">
  <a class="brand" href="#/"><span class="brand-mark"></span>Asset Studio</a>
  <nav class="nav">
    <a href="#/" data-nav="home">스타일</a>
    <a href="#/archive" data-nav="archive">보관함</a>
  </nav>
  <button class="button primary small" id="new-style" type="button">새 스타일</button>
</header>

<main id="view"></main>

<div class="lost" id="lost" hidden>서버에 연결할 수 없어요. 다시 연결하는 중…</div>
<div class="toasts" id="toasts"></div>
<div class="menu" id="menu" hidden></div>

<div class="modal" id="modal" hidden>
  <form class="modal-box" id="modal-form">
    <h2 id="modal-title"></h2>
    <p class="modal-description" id="modal-description"></p>
    <textarea class="text-input" id="modal-input"></textarea>
    <div class="modal-choices" id="modal-choices" hidden></div>
    <p class="field-error" id="modal-error" hidden></p>
    <div class="modal-actions">
      <button class="button" type="button" id="modal-cancel">취소</button>
      <button class="button primary" type="submit" id="modal-confirm"></button>
    </div>
  </form>
</div>

<div class="lightbox" id="lightbox" hidden>
  <div class="lightbox-stage">
    <button class="lightbox-nav previous" id="lightbox-previous" type="button" aria-label="이전"></button>
    <img id="lightbox-image" alt="">
    <button class="lightbox-nav next" id="lightbox-next" type="button" aria-label="다음"></button>
  </div>
  <aside class="lightbox-info" id="lightbox-info"></aside>
  <div class="lightbox-bar">
    <span class="lightbox-count" id="lightbox-count"></span>
    <button class="button icon-only" id="lightbox-add" type="button" title="레퍼런스에 추가" hidden></button>
    <a class="button icon-only" id="lightbox-download" title="다운로드" download></a>
    <button class="button icon-only" id="lightbox-close" type="button" title="닫기"></button>
  </div>
</div>

<script src="/ui.js"></script>
<script src="/app.js"></script>
</body>
</html>
