<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b6ef5'/%3E%3Cpath d='M9 21l5-10 4 7 2-3 3 6z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>try { const theme = localStorage.getItem("theme"); if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme; } catch {}</script>
<link rel="stylesheet" href="/ui.css">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="appbar">
  <a class="brand" href="#/"><span class="brand-mark"></span>Asset Studio</a>
  <nav class="nav">
    <a href="#/" data-nav="home" data-t>Projects</a>
    <a href="#/archive" data-nav="archive" data-t>Archive</a>
  </nav>
  <div class="appbar-actions">
    <div class="presence" id="presence"></div>
    <div id="theme"></div>
    <div id="language"></div>
    <button class="button primary small" id="new-project" type="button" data-t>New project</button>
  </div>
</header>

<main id="view"></main>

<div class="lost" id="lost" hidden data-t>Server unreachable. Reconnecting…</div>
<div class="toasts" id="toasts"></div>
<div class="menu" id="menu" hidden></div>

<div class="modal" id="modal" hidden>
  <form class="modal-box" id="modal-form">
    <h2 id="modal-title"></h2>
    <p class="modal-description" id="modal-description"></p>
    <pre class="document modal-document" id="modal-document" hidden></pre>
    <textarea class="text-input" id="modal-input"></textarea>
    <div class="modal-choices" id="modal-choices" hidden></div>
    <p class="field-error" id="modal-error" hidden></p>
    <div class="modal-actions">
      <button class="button" type="button" id="modal-cancel" data-t>Cancel</button>
      <button class="button primary" type="submit" id="modal-confirm"></button>
    </div>
  </form>
</div>

<div class="lightbox" id="lightbox" hidden>
  <div class="lightbox-stage">
    <button class="lightbox-nav previous" id="lightbox-previous" type="button" title="Previous" aria-label="Previous" data-t-title></button>
    <img id="lightbox-image" alt="">
    <button class="lightbox-nav next" id="lightbox-next" type="button" title="Next" aria-label="Next" data-t-title></button>
  </div>
  <aside class="lightbox-info" id="lightbox-info"></aside>
  <div class="lightbox-bar">
    <span class="lightbox-count" id="lightbox-count"></span>
    <button class="button icon-only" id="lightbox-add" type="button" title="Add to references" data-t-title hidden></button>
    <a class="button icon-only" id="lightbox-download" title="Download" data-t-title download></a>
    <button class="button icon-only" id="lightbox-close" type="button" title="Close" data-t-title></button>
  </div>
</div>

<script src="/i18n.js"></script>
<script src="/ui.js"></script>
<script src="/app.js"></script>
<script src="/canvas.js"></script>
<script src="/style.js"></script>
</body>
</html>
